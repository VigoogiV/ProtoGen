[workspace]
resolver = "2"
members = ["crates/protogen-core", "crates/protogen-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[workspace.dependencies]
protox = "0.7"
prost-types = "0.13"
encoding_rs = "0.8"
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
